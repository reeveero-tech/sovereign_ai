<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>الذكاء السيادي — المحادثة</title>
<!-- R-786: واجهة المحادثة الأساسية — ملف واحد مستقل، لا اعتماد على ملفات js/ القديمة.
     الواجهة القديمة باقية كما هي على /console. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1114;
    --surface: #171a1f;
    --surface-2: #1e2228;
    --border: #2a2f37;
    --text: #e9e7e3;
    --muted: #9a9ea6;
    --accent: #3fb8a5;
    --accent-ink: #06231f;
    --user: #233a37;
    --danger: #e0716b;
    --radius: 14px;
    --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 16px; line-height: 1.7; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  a { color: var(--accent); }

  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .brand { font-weight: 600; font-size: 17px; white-space: nowrap; }
  .status {
    display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px;
    border: 1px solid var(--border); border-radius: 999px; font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .dot.ok { background: var(--accent); }
  .dot.bad { background: var(--danger); }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 10px; padding: 7px 14px; font-size: 14px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .link { font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .link:hover { color: var(--text); }

  main { flex: 1 1 auto; overflow-y: auto; }
  .thread { max-width: 820px; margin: 0 auto; padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-start; align-items: flex-start; }
  .msg.bot { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: 12px 16px; border-radius: var(--radius); white-space: pre-wrap; overflow-wrap: anywhere;
    background: var(--surface); border: 1px solid var(--border);
  }
  .msg.user .bubble { background: var(--user); border-color: #2f4b47; }
  .msg.error .bubble { border-color: var(--danger); color: #f3c9c6; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; padding: 0 4px; display: flex; gap: 10px; align-items: center; }
  .meta .tools { color: var(--accent); }
  .meta { flex-wrap: wrap; }
  .meta button { background: none; border: none; color: var(--accent); padding: 0; font-size: 12px; }

  .typing { display: inline-flex; gap: 5px; align-items: center; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .empty { text-align: center; padding: 10vh 10px 0; }
  .empty h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .empty p { color: var(--muted); margin: 0 0 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 16px; font-size: 14px; }
  .chip:hover { border-color: var(--accent); }

  footer { flex: 0 0 auto; border-top: 1px solid var(--border); background: var(--surface); padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 48px; max-height: 200px; padding: 12px 14px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
    font: inherit; line-height: 1.6; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .send {
    flex: 0 0 auto; height: 48px; padding: 0 22px; border: none; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  .hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; gap: 8px; }
    .brand { font-size: 15px; }
    .status { max-width: 38vw; font-size: 12px; padding: 3px 10px; }
    .btn { padding: 6px 10px; font-size: 13px; }
    .link { display: none; }
    .thread { padding: 18px 12px 8px; }
    .msg { max-width: 92%; }
    footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .send { padding: 0 16px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">الذكاء السيادي</div>
  <div class="status" id="status" title="حالة الخادم والعقل"><span class="dot" id="dot"></span><span id="statusText">جارٍ الفحص…</span></div>
  <div class="spacer"></div>
  <a class="link" href="/console" title="لوحة المراقبة القديمة: السجل والذاكرة والأدوات والمهام بالتفصيل. فيها زر للعودة إلى المحادثة">اللوحة التقنية</a>
  <button class="btn" id="newChat" type="button" title="يمسح المحادثة الحالية من الشاشة ويبدأ جلسة جديدة بلا سياق سابق">محادثة جديدة</button>
</header>

<main id="scroller">
  <div class="thread" id="thread" aria-live="polite"></div>
</main>

<footer>
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="اكتب رسالتك…" aria-label="الرسالة" maxlength="10000"></textarea>
    <button class="send" id="send" type="submit">إرسال</button>
  </form>
  <div class="hint">Enter للإرسال · Shift+Enter لسطر جديد · العقل يعمل على خادم خاص وقد يستغرق الرد 15–40 ثانية</div>
</footer>

<script>
(function () {
  "use strict";
  var STORE = "sovereign.chat.v1";
  var HISTORY_TURNS = 10;          // آخر 10 رسائل تُرسل سياقًا للعقل
  var TIMEOUT_MS = 170000;         // أكبر من مهلة العقل على الخادم (150ث)

  var thread = document.getElementById("thread");
  var scroller = document.getElementById("scroller");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("statusText");

  var state = load();
  var busy = false;

  function newSession() { return { id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()), messages: [] }; }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(STORE)); if (s && s.id && Array.isArray(s.messages)) return s; } catch (e) {}
    return newSession();
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }
  function fmtTime(ts) { try { return new Date(ts).toLocaleTimeString("ar-SA", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }

  function renderEmpty() {
    var box = el("div", "empty");
    box.appendChild(el("h1", null, "كيف أساعدك؟"));
    box.appendChild(el("p", null, "اكتب سؤالك بالأسفل، أو ابدأ بأحد هذه:"));
    var chips = el("div", "chips");
    ["أخبرني عن قدراتك الحقيقية", "حلل المشروع https://github.com/reeveero-tech/sovereign_ai", "ما حالة النظام الآن؟"].forEach(function (q) {
      var c = el("button", "chip", q); c.type = "button";
      c.addEventListener("click", function () { input.value = q; send(); });
      chips.appendChild(c);
    });
    box.appendChild(chips);
    thread.appendChild(box);
  }

  function bubble(role, text, extra) {
    var wrap = el("div", "msg " + (role === "user" ? "user" : "bot") + (extra && extra.error ? " error" : ""));
    var b = el("div", "bubble"); b.textContent = text; wrap.appendChild(b);
    var meta = el("div", "meta");
    if (extra && extra.ts) meta.appendChild(el("span", null, fmtTime(extra.ts)));
    if (extra && extra.secs != null) meta.appendChild(el("span", null, extra.secs + " ث"));
    if (extra && extra.tools && extra.tools.length) {
      var tl = el("span", "tools", "أدوات النظام المستخدمة: " + extra.tools.map(function (t) { return "\u2068" + t + "\u2069"; }).join(" · "));
      tl.title = "استدعاءات حقيقية لأدوات المشروع، كل منها مسجل بأثر موقّع في السجل السيادي";
      meta.appendChild(tl);
    }
    if (extra && extra.retry) {
      var r = el("button", null, "إعادة المحاولة"); r.type = "button";
      r.addEventListener("click", extra.retry); meta.appendChild(r);
    }
    if (meta.childNodes.length) wrap.appendChild(meta);
    thread.appendChild(wrap);
    return wrap;
  }

  function renderAll() {
    thread.textContent = "";
    if (!state.messages.length) { renderEmpty(); return; }
    state.messages.forEach(function (m) { bubble(m.role, m.content, { ts: m.ts, secs: m.secs, tools: m.tools }); });
    scrollDown();
  }

  function pendingBubble() {
    var wrap = el("div", "msg bot");
    var b = el("div", "bubble");
    var t = el("span", "typing"); t.appendChild(el("span")); t.appendChild(el("span")); t.appendChild(el("span"));
    b.appendChild(t);
    var label = el("span", null, "  يفكر… 0 ث"); label.style.color = "var(--muted)"; label.style.fontSize = "14px";
    b.appendChild(label); wrap.appendChild(b); thread.appendChild(wrap); scrollDown();
    var start = Date.now();
    var timer = setInterval(function () { label.textContent = "  يفكر… " + Math.round((Date.now() - start) / 1000) + " ث"; }, 1000);
    return { node: wrap, stop: function () { clearInterval(timer); wrap.remove(); }, start: start };
  }

  function setBusy(v) { busy = v; sendBtn.disabled = v; sendBtn.textContent = v ? "انتظر…" : "إرسال"; }

  function historyFor(messages) {
    return messages.slice(-HISTORY_TURNS).map(function (m) { return { role: m.role, content: String(m.content).slice(0, 4000) }; });
  }

  function request(text, history) {
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
    return fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, session_id: state.id, user_id: "owner", history: history }),
      signal: ctrl.signal
    }).then(function (r) {
      clearTimeout(to);
      return r.text().then(function (body) {
        var data = null; try { data = JSON.parse(body); } catch (e) {}
        if (r.status === 429) throw new Error("تجاوزت حد الرسائل في الدقيقة. انتظر قليلًا ثم أعد المحاولة.");
        if (!r.ok) throw new Error("الخادم رد بخطأ " + r.status + (data && data.detail ? ": " + (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : ""));
        if (!data || typeof data.reply !== "string" || !data.reply.trim()) throw new Error("وصل رد فارغ من الخادم.");
        return data;
      });
    }, function (err) {
      clearTimeout(to);
      throw new Error(err && err.name === "AbortError" ? "انتهت المهلة دون رد. العقل مشغول أو متوقف، أعد المحاولة." : "تعذر الاتصال بالخادم. تحقق من الإنترنت ثم أعد المحاولة.");
    });
  }

  function send(retryText) {
    if (busy) return;
    var text = retryText != null ? retryText : input.value.trim();
    if (!text) return;
    if (!state.messages.length) thread.textContent = "";
    var history = historyFor(state.messages);
    if (retryText == null) {
      var um = { role: "user", content: text, ts: Date.now() };
      state.messages.push(um); save();
      bubble("user", text, { ts: um.ts });
      input.value = ""; autosize();
    }
    setBusy(true);
    var p = pendingBubble();
    request(text, history).then(function (data) {
      p.stop();
      var secs = Math.round((Date.now() - p.start) / 1000);
      var bm = { role: "assistant", content: data.reply.trim(), ts: Date.now(), secs: secs, tools: data.tools_used || [] };
      state.messages.push(bm); save();
      bubble("assistant", bm.content, { ts: bm.ts, secs: secs, tools: bm.tools });
    }).catch(function (err) {
      p.stop();
      var node = bubble("assistant", err.message, { error: true, retry: function () { node.remove(); send(text); } });
    }).then(function () { setBusy(false); scrollDown(); input.focus(); });
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }

  form.addEventListener("submit", function (e) { e.preventDefault(); send(); });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  document.getElementById("newChat").addEventListener("click", function () {
    if (busy) return;
    state = newSession(); save(); renderAll(); input.focus();
  });

  function checkStatus() {
    Promise.all([
      fetch("/health").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      fetch("/brain/status").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]).then(function (res) {
      var h = res[0], b = res[1];
      if (!h || h.status !== "healthy") { dot.className = "dot bad"; statusText.textContent = "الخادم لا يستجيب"; return; }
      if (!b || !b.enabled) { dot.className = "dot bad"; statusText.textContent = "متصل — العقل غير مفعّل"; return; }
      var last = b.last_call && b.last_call.result;
      dot.className = "dot " + (last === "error" ? "bad" : "ok");
      statusText.textContent = (last === "error" ? "متصل — آخر اتصال بالعقل فشل · " : "متصل · ") + (b.model || "");
    });
  }

  renderAll();
  checkStatus();
  setInterval(checkStatus, 30000);
  input.focus();
})();
</script>
</body>
</html>
