# R-717 — النشر على Fly.io (يدوي فقط — بأمر المالك 2026-10-22)
#
# لماذا هنا لا من بيئة الوكيل؟ بنّاء Fly البعيد يتصل بغير HTTPS، وبيئة الوكيل لا تسمح بذلك.
# الحارس: tests/test_deploy_workflow_fly.py (يدوي فقط، رمز من الأسرار، صلاحيات مقيدة،
# بوابة CI ناجح على نفس SHA، فحص /health).
#
# المتطلبات (مرة واحدة):
#   - سر المستودع FLY_API_TOKEN: رمز نشر خاص بالتطبيق (fly tokens create deploy -a <app>).
#   - أسرار التطبيق على Fly: SOVEREIGN_KEY و CORS_ORIGINS (fly secrets set) — الإقلاع يرفض بدونهما.
# الاسم لا يحوي حرفي «C» و«I» متتاليين كبيرين حتى لا يلتقطه اختيار التشغيل المرجعي في verify.sh.

name: Deploy — Fly.io (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_app:
        description: 'اكتب اسم التطبيق للتأكيد (sovereign-ai-k20elq)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_APP: sovereign-ai-k20elq
    steps:
      - uses: actions/checkout@v4

      - name: Confirm target app
        env:
          CONFIRM: ${{ inputs.confirm_app }}
        run: |
          if [ "$CONFIRM" != "$FLY_APP" ]; then
            echo "❌ التأكيد لا يطابق اسم التطبيق ($FLY_APP)"; exit 1
          fi

      - name: 'Gate: green CI push run on the same SHA'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(gh run list --repo "${{ github.repository }}" --commit "${{ github.sha }}" \
            --event push --limit 20 --json workflowName,status,conclusion \
            --jq '[.[] | select(.workflowName | startswith("CI"))] | first | (.status + "/" + .conclusion)')
          echo "CI on ${{ github.sha }}: ${RESULT:-none}"
          if [ "$RESULT" != "completed/success" ]; then
            echo "❌ لا نشر: لا يوجد تشغيل CI ناجح مكتمل على هذا الالتزام"; exit 1
          fi

      - name: 'Gate: deploy token present'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "❌ سر المستودع FLY_API_TOKEN غير مضبوط"; exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # 1.6
        with:
          version: 0.4.120

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -a sovereign-ai-k20elq --remote-only --ha=false --wait-timeout 5m0s

      # R-719 (بأمر المالك 2026-10-22: «قاعدة البيانات قرص للمشروع وذاكرة له»):
      # مزامنة أسرار Supabase إلى Fly — مشروطة بوجودهما في أسرار المستودع.
      # الغياب ليس خطأً: الطبقة معطلة افتراضيًا (نمط Ollama R-704).
      - name: 'R-719: Sync Supabase secrets to Fly (disk/memory)'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "أسرار Supabase غير مضبوطة — تخطي (الطبقة معطلة على Fly، لا فشل)"
            exit 0
          fi
          flyctl secrets set -a "$FLY_APP" SUPABASE_URL="$SUPABASE_URL" SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY"

      # R-718: سجل التشغيل 39746031804 أثبت أن flyctl deploy يحدّث الآلة ويتركها
      # stopped (d891e26ea24d38 «reached stopped state») — بلا خطوة تشغيل صريحة
      # يبقى التطبيق بلا سجل DNS ويفشل فحص الدخان دومًا.
      # R-718 (تكملة): بدء الآلة وحده لم يكفِ — الآلة بدأت (تشغيل 39749764649:
      # «d891e26ea24d38 has been started») وبقي التطبيق بلا سجل DNS بعد 8 دقائق.
      # تطبيق suspended (حالة موثقة في R-717) لا يُخدم حتى يُستأنف — الاستئناف
      # مشروط بقراءة الحالة (لا تغيير إن لم يكن معلقًا).
      - name: 'R-718: Resume app if suspended (read state first)'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          STATUS_JSON=$(flyctl status -a "$FLY_APP" --json || true)
          echo "$STATUS_JSON" | head -c 600
          if echo "$STATUS_JSON" | grep -qi 'suspended'; then
            echo "التطبيق معلق — استئناف (scale count 1 — بديل resume المهجور)..."
            flyctl scale count 1 -a "$FLY_APP"
          else
            echo "التطبيق ليس معلقًا (أو الحالة غير واضحة) — لا استئناف"
          fi

      - name: 'R-718: Start machines (deploy may leave them stopped)'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          STOPPED=$(flyctl machine list -a "$FLY_APP" --json | jq -r '.[] | select(.state == "stopped") | .id')
          if [ -z "$STOPPED" ]; then
            echo "لا آلات متوقفة — لا شيء لبدئه"
            exit 0
          fi
          for MID in $STOPPED; do
            echo "بدء الآلة المتوقفة: $MID"
            flyctl machine start -a "$FLY_APP" "$MID"
          done

      # R-718 (السبب الجذري الثالث — تشغيل 39754774743): الآلة started وفحص
      # صحة Fly نفسه نجح، لكن سجل fly.dev DNS غائب كليًا (NODATA عند ns1.flydns.net).
      # التشخيص الموثق (مجتمع Fly): تطبيق بلا IPv4 عام لا تُنشر سجلات fly.dev
      # الخاصة به — الحل allocate-v4 --shared. الخطوة تقرأ الحالة أولًا ولا
      # تخصص إلا عند الغياب (لا تغيير إن كان العنوان موجودًا).
      - name: 'R-718: Ensure public IPs (fly.dev DNS prerequisite)'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          IPS=$(flyctl ips list -a "$FLY_APP" --json 2>/dev/null || echo "[]")
          echo "$IPS"
          V4=$(echo "$IPS" | jq '[.[] | ((.Type // .type) // "")] | map(select(. == "public_v4")) | length')
          V6=$(echo "$IPS" | jq '[.[] | ((.Type // .type) // "")] | map(select(. == "public_v6")) | length')
          if [ "$V4" -eq 0 ]; then
            echo "لا IPv4 عام — تخصيص مشترك (جذر سجل fly.dev DNS)"
            flyctl ips allocate-v4 --shared -a "$FLY_APP"
          else
            echo "IPv4 عام موجود ($V4)"
          fi
          if [ "$V6" -eq 0 ]; then
            echo "لا IPv6 عام — تخصيص (مطلوب للشهادات)"
            flyctl ips allocate-v6 -a "$FLY_APP" || echo "تعذر IPv6 — نكمل (A يكفي لـ fly.dev)"
          else
            echo "IPv6 عام موجود ($V6)"
          fi

      - name: 'Smoke: /health on public URL'
        run: |
          URL="https://${FLY_APP}.fly.dev/health"
          # نافذة 10 دقائق: سجل fly.dev الجديد يحتاج نشر DNS (TTL يصل 5 دقائق
          # وفق توثيق Fly) — 3 دقائق السابقة لم تكفِ (تشغيل 39754774743).
          for i in $(seq 1 60); do
            BODY=$(curl -s -m 10 "$URL" || true)
            if echo "$BODY" | grep -q '"status":"healthy"'; then
              echo "✅ $URL healthy"; echo "$BODY" | head -c 300; exit 0
            fi
            sleep 10
          done
          echo "❌ $URL لم يصبح healthy"; echo "$BODY" | head -c 500; exit 1
