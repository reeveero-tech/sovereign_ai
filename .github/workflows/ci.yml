name: CI — Quality Gates (M4)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # R-682 (Task 3.3): manual trigger for operational job
    inputs:
      run_operational:
        description: 'Run operational tests (requires KEY_SECRET secret)'
        required: false
        default: false
        type: boolean
      run_verify_full:
        description: 'R-682 (items 11/13): run verify.sh --full on this runner (Python 3.11)'
        required: false
        default: false
        type: boolean
      ci_run_id:
        description: 'R-682: explicit reference CI run ID for comparison (prevents self-selection)'
        required: false
        default: ''
        type: string

jobs:
  test:
    name: Tests + Atomic Batch Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # قرار المالك (Issue #8): أي التزام يحذف سطراً بلا # DELETION-JUSTIFIED
      # في نفس الالتزام يُرفض تلقائياً (checkout بعمق كامل — fetch-depth: 0).
      - name: 'Owner rule (Issue #8): reject commits deleting lines without # DELETION-JUSTIFIED'
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          # الالتزامات الدمجية تُفحص عند وقوعها (git show لا يعطي numstat لها افتراضياً)
          PARENTS=$(git rev-list --parents -n 1 "${SHA}" | wc -w)
          if [ "${PARENTS}" -gt 2 ]; then
            echo "⏭️ التزام دمجي — يُفحص بمعايير خاصة عند وقوعه"
            exit 0
          fi
          DELETIONS=$(git show --numstat --format= "${SHA}" | awk '$1 != "-" && $2 ~ /^[0-9]+$/ {s+=$2} END {print s+0}')
          echo "أسطر الحذف في هذا الالتزام: ${DELETIONS}"
          if [ "${DELETIONS}" -eq 0 ]; then
            echo "✅ لا حذوفات — لا يلزم تبرير"
            exit 0
          fi
          # ملاحظة إصلاحية (الجولة <2>): grep -q يخرج عند أول تطابق فيُقتل git show
          # بإشارة SIGPIPE، ومع set -o pipefail يُرفض التطابق الصحيح (رفض زائف).
          # grep بلا -q يقرأ كل المخرج فلا يحدث SIGPIPE — نفس المنطق بلا العطل.
          if git log -1 --format=%B "${SHA}" | grep "# DELETION-JUSTIFIED" >/dev/null || git show "${SHA}" | grep "# DELETION-JUSTIFIED" >/dev/null; then
            echo "✅ الحذوفات مبررة بعلامة # DELETION-JUSTIFIED في نفس الالتزام"
            exit 0
          fi
          echo "❌ مرفوض تلقائياً: الالتزام يحذف ${DELETIONS} سطراً بلا # DELETION-JUSTIFIED في نفس الالتزام — قرار المالك (Issue #8)"
          exit 1

      # القاعدة الحاكمة (D-040 — R-722 بأمر المالك 2026-10-22): أي التزام يغيّر
      # كودًا (backend/frontend/tools/tests/التكوين) يجب أن يحدّث وثائق المشروع
      # (docs/ أو forensics/) في نفس الالتزام — لا دفعة وثائق منفصلة.
      - name: 'Owner rule (D-040): reject code changes without docs update in the same commit'
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          PARENTS=$(git rev-list --parents -n 1 "${SHA}" | wc -w)
          if [ "${PARENTS}" -gt 2 ]; then
            echo "⏭️ التزام دمجي — يُفحص بمعايير خاصة عند وقوعه"
            exit 0
          fi
          FILES=$(git show --name-only --format= "${SHA}")
          CODE=$(echo "$FILES" | grep -E '^(backend/|frontend/|tools/|tests/|\.github/|fly\.toml$|verify\.sh$|requirements\.txt$|pytest\.ini$)' || true)
          DOCS=$(echo "$FILES" | grep -E '^(docs/|forensics/)' || true)
          if [ -z "${CODE}" ]; then
            echo "✅ لا تغييرات كود — لا يلزم تحديث وثائق"
            exit 0
          fi
          if [ -n "${DOCS}" ]; then
            echo "✅ الالتزام يحدّث الوثائق مع الكود في نفس الدفعة (D-040)"
            exit 0
          fi
          echo "❌ مرفوض تلقائياً (D-040): الالتزام يغيّر كودًا دون تحديث وثائق المشروع في نفس الالتزام — القاعدة الحاكمة بأمر المالك (R-722)"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # R-682 (البند ١١): إفصاح بيئة التحقق — يطبع إصدار Python الكامل
      # وقائمة الحزم المثبتة فعليًا وpip check — خام، لإثبات PY311_VERIFICATION.md
      - name: 'R-682: Disclose verification environment (python -VV + pip freeze + pip check)'
        run: |
          echo "=== python -VV ==="
          python -VV
          echo "=== pip freeze (installed) ==="
          pip freeze
          echo "=== pip check ==="
          pip check
          echo "=== END environment disclosure ==="

      - name: 'R-681: Generate ephemeral data/key.secret for CI (root fix for skips)'
        run: |
          set -euo pipefail
          mkdir -p data
          # Preferred: KEY_SECRET env var; fallback: auto-generate for CI.
          # This file is gitignored and never committed — CI ephemeral only.
          if [ -n "${KEY_SECRET:-}" ]; then
            printf '%s' "$KEY_SECRET" > data/key.secret
            echo "key.secret provided via KEY_SECRET env (length: $(wc -c < data/key.secret))"
          else
            python -c "import secrets; print(secrets.token_urlsafe(32))" > data/key.secret
            chmod 600 data/key.secret
            echo "key.secret auto-generated for CI (ephemeral — not committed)"
          fi
          ls -la data/key.secret

      - name: Capture git SHA (provenance)
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          git rev-parse HEAD > forensics/.ci_sha.txt

      - name: Run test suite (tests/ + backend/tests/) with JUnit + SHA
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # R-682 (Task 3.3): -m "not operational" — operational tests deselected (not skipped).
          python -m pytest tests/ backend/tests/ -v \
            -m "not operational" \
            --junitxml=forensics/pytest_results.xml \
            --junit-prefix="R-682-ci-sha-${SHA}" \
            || { echo "❌ pytest FAILED — see forensics/pytest_results.xml"; exit 1; }

      - name: 'R-682: Verify zero skips (DoD hard requirement)'
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          tree = ET.parse("forensics/pytest_results.xml")
          root = tree.getroot()
          skipped = sum(int(ts.get("skipped", 0)) for ts in root.iter("testsuite"))
          if skipped != 0:
              print(f"❌ DoD violated: {skipped} skipped tests found — must be 0")
              # List skipped test names
              for tc in root.iter("testcase"):
                  if tc.find("skipped") is not None:
                      s = tc.find("skipped")
                      print(f"   SKIPPED: {tc.get('classname')}.{tc.get('name')}: {s.get('message')}")
              raise SystemExit(1)
          print(f"✅ Zero skips confirmed — {skipped} skipped")
          EOF

      - name: Upload JUnit XML artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-${{ steps.sha.outputs.short }}
          path: forensics/pytest_results.xml
          if-no-files-found: error

      - name: Print JUnit provenance summary
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          import subprocess
          sha = subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()
          tree = ET.parse("forensics/pytest_results.xml")
          root = tree.getroot()
          def walk(s):
              for ts in s.iter("testsuite"):
                  print(f"suite={ts.get('name')} tests={ts.get('tests')} "
                        f"failures={ts.get('failures')} errors={ts.get('errors')} "
                        f"skipped={ts.get('skipped')}")
          walk(root)
          print(f"PROVENANCE git SHA = {sha}")
          # inject SHA into XML root attributes for tamper-evidence
          root.set("git_sha", sha)
          root.set("junit_prefix", f"R-682-ci-sha-{sha}")
          ET.indent(tree)
          tree.write("forensics/pytest_results.xml", encoding="utf-8", xml_declaration=True)
          print("✅ git SHA embedded in JUnit XML")
          EOF

      - name: Upload JUnit XML with embedded SHA (second artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-with-sha-${{ steps.sha.outputs.short }}
          path: forensics/pytest_results.xml
          if-no-files-found: error

      - name: Atomic batch gate — docs must change with code
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - << 'EOF'
          import os, subprocess, sys

          base = os.environ["BASE"]
          head = os.environ["HEAD"]
          changed = subprocess.run(
              ["git", "diff", "--name-only", base, head],
              capture_output=True, text=True
          ).stdout.splitlines()

          code_files = [f for f in changed if f.startswith(("backend/", "frontend/", "nexus/", "main.py", "start.sh", "Dockerfile"))]
          if not code_files:
              print("✅ No code changed — gate not required.")
              sys.exit(0)

          required_docs = ["docs/ROADMAP.md", "docs/PROJECT_STATE.md"]
          missing = [d for d in required_docs if d not in changed]
          if missing:
              print(f"❌ Atomic batch gate FAILED: code changed but these docs did not: {missing}")
              print("   Rule: any code change must update ROADMAP.md + PROJECT_STATE.md in the SAME batch.")
              sys.exit(1)

          print(f"✅ Atomic batch gate passed — {len(code_files)} code files + docs updated together.")
          EOF

  # R-682 (Task 3.3): Separate operational job — manual trigger only.
  # Reads host secrets (KEY_SECRET), writes real data. NOT part of default CI.
  operational:
    name: Operational Tests (manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_operational == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture git SHA (provenance)
        id: sha
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          git rev-parse HEAD > forensics/.ci_sha.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # R-682 (جولة التشغيلية — أمر المستشار): السران يُمرَّران عبر env (لا
      # استيفاء مباشر داخل run)، والملفات بـ umask 077 + printf، وقيمهما لا
      # تُطبع أبدًا ولا تدخل أي artifact.
      - name: Load keys from repository secrets (KEY_SECRET + KEY_OLD_SECRET)
        env:
          KEY_SECRET: ${{ secrets.KEY_SECRET }}
          KEY_OLD_SECRET: ${{ secrets.KEY_OLD_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_SECRET}" ] || [ -z "${KEY_OLD_SECRET}" ]; then
            echo "❌ KEY_SECRET and KEY_OLD_SECRET secrets must both be configured"
            echo "   KEY_SECRET     = current master key (data/key.secret)"
            echo "   KEY_OLD_SECRET = old rotated key (data/key.secret.old_rotated_2026_10_14)"
            echo "   — cannot run operational tests"
            exit 1
          fi
          umask 077
          mkdir -p data
          printf '%s' "$KEY_SECRET" > data/key.secret
          printf '%s' "$KEY_OLD_SECRET" > data/key.secret.old_rotated_2026_10_14
          echo "key.secret + old_rotated loaded from secrets (values never printed)"

      - name: Run operational tests
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          python -m pytest -m operational -v --run-operational \
            --junitxml=forensics/pytest_operational.xml \
            --junit-prefix="R-682-operational-sha-${SHA}" \
            || { echo "❌ operational tests FAILED"; exit 1; }

      - name: Upload operational JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-operational-${{ steps.sha.outputs.short }}
          path: forensics/pytest_operational.xml
          if-no-files-found: warn

  # R-682 (البندان ١١ و١٣): مهمة التحقق الكامل على Python 3.11 داخل Actions —
  # تشغّل verify.sh --full (بوابة الإصدار ترفض غير 3.11) مع اختيار صريح
  # لتشغيل CI المرجعي (ci_run_id) يمنع الانتقاء الذاتي.
  verify-full:
    name: Full verification (verify.sh --full, manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_verify_full == 'true'
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 'R-681: Generate ephemeral data/key.secret for CI'
        run: |
          set -euo pipefail
          mkdir -p data
          python -c "import secrets; print(secrets.token_urlsafe(32))" > data/key.secret
          chmod 600 data/key.secret
          echo "key.secret auto-generated for CI (ephemeral — not committed)"

      - name: Run the LITERAL owner verification command (verify.sh --full from a clean clone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ github.event.inputs.ci_run_id }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA"
          # الأمر الحرفي من الأمر الدائم للمالك — من clone نظيف مثبّت على الـ SHA
          cd /tmp && rm -rf verify_exec && git clone -q https://github.com/reeveero-tech/sovereign_ai.git verify_exec && cd verify_exec && git checkout -q "$TARGET_SHA" && timeout 1500 bash verify.sh --full
