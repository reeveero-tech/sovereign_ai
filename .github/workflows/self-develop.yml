name: Self-Develop (R-796)

# R-796 (بأمر المالك 2026-10-28): نصف «التطبيق والإثبات» من محرك التطوير الذاتي.
# الإنتاج يصوغ المسودات فقط (backend/self_develop.py — لا كتابة ملفات، D-041 قائم)؛
# هنا في بيئة CI مؤقتة معزولة: فرع work/selfdev-* من main، الاختبار يفشل على الكود
# الأصلي (RED) ثم ينجح بعد التعديل (GREEN)، بوابة الحذف + بوابة الوثائق + المجموعة
# الكاملة، ثم دفع الفرع وتشغيل ci.yml عليه.
# R-797 (قرار المالك 2026-10-28 «فعّل الترقية الآلية»): حين يكون متغير المستودع
# SELFDEV_AUTO_PROMOTE='1' — CI أخضر على نفس البصمة ⇒ تقدم سريع فقط إلى main ⇒
# deploy-fly.yml (بوابة CI + فحص /health). قاطع دائرة: نشر آلي فاشل يوقف الترقيات
# حتى تشغيل يدوي بـ reset_circuit=true. إيقاف فوري: احذف المتغير أو اجعله '0'.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'عدد المهام في الدورة (1-5)'
        required: false
        default: '1'
      reset_circuit:
        description: 'إعادة ضبط قاطع الدائرة بعد نشر آلي فاشل (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: self-develop
  cancel-in-progress: false

jobs:
  selfdev:
    name: Self-Develop cycle (RED→GREEN on work/selfdev-* → auto-promotion)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 'Ephemeral data/key.secret for the test suite (same as ci.yml R-681)'
        run: |
          set -euo pipefail
          mkdir -p data
          python -c "import secrets; print(secrets.token_urlsafe(32))" > data/key.secret
          chmod 600 data/key.secret

      - name: Git identity (selfdev bot)
        run: |
          git config user.name "sovereign-selfdev[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run self-develop cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
          SELFDEV_PUSH: '1'
          SELFDEV_MAX_TASKS: ${{ github.event.inputs.max_tasks || '1' }}
          SELFDEV_AUTO_PROMOTE: ${{ vars.SELFDEV_AUTO_PROMOTE }}
          SELFDEV_RESET_CIRCUIT: ${{ github.event.inputs.reset_circuit || 'false' }}
        run: python tools/selfdev_ci.py
