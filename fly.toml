# fly.toml app configuration file generated for sovereign-ai-k20elq on 2026-06-03T19:00:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sovereign-ai-k20elq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  PYTHONPATH = '/app'
  # ⚠️ SECURITY (جولة المجلس <1> — أمين 2.2): الإنتاج صريح — الرفض المغلق يعمل
  # (SOVEREIGN_KEY يُمرّر عبر `fly secrets`، لا عبر هذا الملف).
  AI_ENVIRONMENT = 'production'
  # R-779: مخصص glibc — 900ث محليًا: افتراضي 221MB، هذا الضبط 154MB، المعالج نفسه
  # (forensics/R-779_measure_allocator.txt). عدد الساحات مقيد لأن الخيوط ~126.
  MALLOC_ARENA_MAX = '2'
  MALLOC_MMAP_THRESHOLD_ = '131072'
  MALLOC_TRIM_THRESHOLD_ = '131072'
  # R-787: جسر المحادثة ↔ الأدوات — قراءة الروابط (web.fetch محروس SSRF) بأمر المالك
  WEB_TOOLS_ENABLED = 'true'
  OLLAMA_NUM_CTX = '8192'
  # R-791/R-792: حلقة الاستقلال (§6.9.٤) بأمر المالك — تأمل من ملاحظات حقيقية ثم عمل، كل 30 دقيقة
  SOVEREIGN_AUTONOMY = '1'
  SOVEREIGN_AUTONOMY_INTERVAL = '1800'
  # R-792: لحظة وعي محفوظة كل 5ث بملف يومي (لا ملف لكل لحظة — استنفاد inodes حيًا)
  SOVEREIGN_MOMENT_SAVE_INTERVAL = '5'
  # R-795 (2026-10-28، بأمر المالك في المحادثة «أريد أن يستمر بمراقبة نفسه ويراقب
  # العالم ويستمر في تطوير نفسه»): تفعيل المجدول — الدورات الدورية (صحة/عيوب/
  # مراقبة ذاتية 4.6) صارت حية في الإنتاج. كل تشغيل يُلحق حدثًا موقعًا بالسجل
  # الدائم؛ الفاصل الافتراضي 300ث (SOVEREIGN_SCHEDULER_INTERVAL). إضافة فقط.
  SOVEREIGN_SCHEDULER = '1'
  # R-815 (2026-10-29، بأمر المالك «إحياء كل ما هو ميت»): الحارس المعزول حي في
  # الإنتاج — نبضه كان العيب الوحيد المفتوح في defects.scan. نقطة الدخول تُطلقه
  # كعملية مرافقة كمستخدم التطبيق؛ الفاصل 30ث داخل النطاق (0، 60] الذي يقبله /n.
  SOVEREIGN_SUPERVISOR = '1'
  SOVEREIGN_SUPERVISOR_INTERVAL = '30'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    path = '/health'

# R-760 (بأمر المالك D-044): قرص دائم لبيانات الإنتاج — حلقة المفاتيح والسجل
# السيادي وختم الهوية والمهام والمهارات تبقى عبر إعادة النشر (كانت تُمحى).
[mounts]
  source = 'sovereign_data'
  destination = '/app/data'

# R-770 (2026-10-26): 512MB → 1024MB — الإنتاج قُتل بنفاد الذاكرة (oom_killed) عند كل إقلاع
# على سجل 46k حدث؛ أُصلح سبب الإقلاع في الكود، والرفع هامش لنمو السجل حتى يُعالج معدل
# الكتابة الدوري (R-771). # DELETION-JUSTIFIED: السطر القديم memory = '512'.
[[vm]]
  memory = '1024'
  cpu_kind = 'shared'
  cpus = 1

# R-698 (جاهزية النشر): الأسرار لا تُوضع في هذا الملف أبدًا — تُضبط بأوامر
# ينفذها المالك (docs/DEPLOYMENT_READY.md للقائمة الكاملة):
#   fly secrets set SOVEREIGN_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
#   fly secrets set CORS_ORIGINS="https://your-domain.example"
# الصورة ترفض الإقلاع بدونهما في الإنتاج (فشل مغلق — D-034/RK-02).
