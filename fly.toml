# fly.toml - Sovereign AI Platform (Python/Uvicorn)

app = "sovereign-ai"
primary_region = "ams"

[build]
  # لا حاجة لـ buildpacks عند استخدام Dockerfile
  # فقط حدد مسار Dockerfile
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# إضافة موارد كافية
[vm]
  memory = "512"
  cpu_kind = "shared"
  cpus = 1

# ============================================================
# Health check (اختياري)
# ============================================================
[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
