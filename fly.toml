# fly.toml app configuration file generated for sovereign-ai-k20elq on 2026-06-03T19:00:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sovereign-ai-k20elq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  PYTHONPATH = '/app'
  # ⚠️ SECURITY (جولة المجلس <1> — أمين 2.2): الإنتاج صريح — الرفض المغلق يعمل
  # (SOVEREIGN_KEY يُمرّر عبر `fly secrets`، لا عبر هذا الملف).
  AI_ENVIRONMENT = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    path = '/health'

[[vm]]
  memory = '512'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
